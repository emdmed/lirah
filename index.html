<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lirah.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The terminal and chrome face; preloaded so xterm measures it, not a fallback. -->
    <link rel="preload" href="/fonts/Typestar-OCR.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/GrenzeGotisch-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
    <title>Lirah</title>
    <!--
      Boot splash. The window starts hidden (tauri.conf.json "visible": false)
      so the bare webview never shows. This paints in the last theme's colours
      before any module loads, then shows the window; main.jsx fades it out
      once the app has rendered.
    -->
    <style>
      /* index.css is not loaded yet, so the splash declares its own faces. */
      @font-face { font-family: 'Grenze Gotisch'; src: url('/fonts/GrenzeGotisch-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: block; }
      @font-face { font-family: 'Geist Mono'; src: url('/fonts/GeistMono-Regular.woff2') format('woff2'); font-weight: 400; font-display: block; }
      html, body { margin: 0; background: var(--splash-bg, #1e1e26); }
      #splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: grid; place-items: center;
        background: var(--splash-bg, #1e1e26);
        color: var(--splash-ink, #d8d4c8);
        transition: opacity 220ms ease-out;
      }
      /* The mark stays invisible until the window has its final (tiled) size,
         so it never shows centred in the pre-tiling 1024x768 viewport. */
      #splash .mark { display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; transition: opacity 160ms ease-out; }
      #splash.is-ready .mark { opacity: 1; }
      #splash .plate { position: relative; width: 420px; height: 170px; }
      #splash .orbits { position: absolute; inset: 0; overflow: visible; }
      #splash .sun { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; transform: translate(-50%, -50%); fill: var(--splash-lamp, #dcb662); stroke: var(--splash-lamp, #dcb662); }
      #splash ellipse { fill: none; stroke: currentColor; stroke-width: 1; opacity: .4; stroke-dasharray: 1; stroke-dashoffset: 1; }
      /* Inner orbit brightest, fading outward. */
      #splash ellipse:nth-child(2) { opacity: .34; }
      #splash ellipse:nth-child(3) { opacity: .28; }
      #splash ellipse:nth-child(4) { opacity: .22; }
      /* The sun's rings and rays, in gold around the mark. */
      #splash .rays { fill: none; stroke: var(--splash-lamp, #dcb662); stroke-width: .8; }
      /* Four orbits draw in, inner first, inside ~500ms of the mark showing. */
      #splash.is-ready ellipse { animation: splash-orbit 380ms cubic-bezier(.2, .7, .2, 1) forwards; }
      #splash.is-ready ellipse:nth-child(2) { animation-delay: 40ms; }
      #splash.is-ready ellipse:nth-child(3) { animation-delay: 80ms; }
      #splash.is-ready ellipse:nth-child(4) { animation-delay: 120ms; }
      #splash .word { font: 600 30px/1 'Grenze Gotisch', serif; }
      #splash .note { font: 10px/1 'Geist Mono', monospace; letter-spacing: 1px; text-transform: uppercase; opacity: .55; min-height: 10px; }
      #splash.is-done { opacity: 0; pointer-events: none; }
      #splash[hidden] { display: none; }
      /* Zen shifts reuse the splash as a bare veil on the terminal's colour: no
         mark, only the arrival hairline (as .ins-arrive) laid over the edge the
         chrome folds into. settingsStore drives it; the tokens exist by then. */
      #splash.is-zen { background: var(--ins-glass); }
      #splash .zen-rule { display: none; position: absolute; left: 0; right: 0; height: 1px; background: var(--color-foreground); transform-origin: right; transform: scaleX(0); }
      #splash.is-zen .mark { display: none; }
      #splash.is-zen .zen-rule { display: block; }
      @keyframes splash-orbit { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash .mark { transition: none; }
        #splash ellipse, #splash.is-ready ellipse { animation: none; stroke-dashoffset: 0; }
      }
    </style>
    <script>
      try {
        // Written by ThemeContext (colours) and workspaceStore (tab count).
        ['bg', 'ink', 'lamp'].forEach(function (k) {
          var v = localStorage.getItem('lirah-splash-' + k);
          if (v) document.documentElement.style.setProperty('--splash-' + k, v);
        });
        window.__splashTabs = Number(localStorage.getItem('lirah-splash-tabs')) || 0;
      } catch (e) {}
    </script>
  </head>

  <body>
    <!--
      THESIS: Lirah is an Instrument TUI. It keeps the terminal UI's layout
      (titles set into pane borders, [label] buttons, keyboard first, square
      chrome) and adds analog parts only where they carry meaning.
      MATERIAL: Flat chrome on a dark gutter; one glass screen (the terminal);
      printed panel legends; lamps for live state; a meter only for values
      with a ceiling; keycaps for keys. Glow is scarce, reserved for live
      values and lit state.
      STORY: The operator reads state at a glance from lamps and legends, then
      works in the one large glass. The lit pane is the one holding focus.
      DOCUMENTED IN: DESIGN.md (tokens, primitives, icon policy).
    -->
    <div id="splash" aria-hidden="true">
      <div class="mark">
        <div class="plate">
          <svg class="orbits" viewBox="0 0 420 170"><g transform="rotate(-11 210 85)"><ellipse pathLength="1" cx="210" cy="85" rx="70" ry="29.4"/><ellipse pathLength="1" cx="210" cy="85" rx="112" ry="47"/><ellipse pathLength="1" cx="210" cy="85" rx="154" ry="64.7"/><ellipse pathLength="1" cx="210" cy="85" rx="195" ry="81.9"/></g><g class="rays" transform="translate(210 85)"><circle r="30" stroke-width=".6" stroke-dasharray="1 3"/><circle r="21" style="fill: var(--splash-bg, #1e1e26)"/><path d="M-46 0H-24M24 0H46M0 -42V-24M0 24V42"/></g></svg>
          <!-- The Lirah mark (LirahMark.jsx paths) as the gold sun. -->
          <svg class="sun" viewBox="6 6 88 88"><path transform="translate(50 52) scale(.86) translate(-50 -49.5)" d="M22 8C24 34 12 48 14 64C16 84 32 94 50 94C68 94 84 84 86 64C88 48 76 34 78 8C77 34 70 48 70 60C70 74 62 80 50 80C38 80 30 74 30 60C30 48 23 34 22 8Z" stroke="none"/><circle cx="50" cy="27" r="9.5" fill="none" stroke-width="2.6"/><circle cx="50" cy="27" r="5" stroke="none"/></svg>
        </div>
        <div class="word">Lirah</div>
        <div class="note" id="splash-note"></div>
      </div>
      <div class="zen-rule"></div>
    </div>
    <script>
      // Show the window once the splash background has painted. The window
      // manager may resize it right after mapping (tiling), so reveal the mark
      // only once the size has settled: no resize for 120ms, or 400ms at most.
      // main.jsx waits on window.__splashReady before retiring the splash.
      window.__splashReady = new Promise(function (resolve) {
        var splash = document.getElementById('splash');
        var n = window.__splashTabs;
        if (n) document.getElementById('splash-note').textContent = 'restoring ' + n + (n === 1 ? ' tab' : ' tabs');
        var settle, cap;
        function reveal() {
          clearTimeout(settle); clearTimeout(cap);
          window.removeEventListener('resize', onResize);
          splash.classList.add('is-ready');
          resolve(performance.now());
        }
        function onResize() { clearTimeout(settle); settle = setTimeout(reveal, 120); }
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            window.addEventListener('resize', onResize);
            settle = setTimeout(reveal, 120);
            cap = setTimeout(reveal, 400);
            var t = window.__TAURI_INTERNALS__;
            if (t) t.invoke('plugin:window|show', { label: 'main' }).catch(function () {});
          });
        });
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
