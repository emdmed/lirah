      THESIS: Lirah is a laboratory instrument, not a document. It refuses the
      drawn box: regions are milled into a chassis, never outlined.
      OWN-WORLD: Blackened chassis ground; regions recessed by an engraved
      hairline (dark above, light below), never a border. Engraved caps label
      every control. The theme's accent is plasma glow, scarce, reserved for
      live values and lit state alone. Zero radius. Tabular numerals are a
      first-class type role.
      STORY: The operator reads state at a glance from lit instrumentation,
      then works in the one large unlit field. Scarcity of glow is the
      hierarchy: the terminal is calm because nothing there is lit.
      FIRST VIEWPORT: Terminal centre, unlit, full measure. Counts sit in
      fixed-position tube banks in the status bar and composer. The lit digit
      is the only warm thing on screen.
      FORM: Nixie laboratory counter; direction 1 of the bolder hand; seed a66caf23.
