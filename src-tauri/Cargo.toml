[package]
name = "lirah"
version = "0.3.42"
description = "A terminal emulator built with Tauri"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nevo_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
notify = "6.1"
rustpython-parser = "0.4"
dirs = "5.0"
sysinfo = "0.33"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
# panic = "abort" deliberately omitted: background work relies on unwinding to
# contain a panic. tokio catches panics in spawn_blocking/async commands and the
# callers turn the JoinError into an error string (fs/tokens.rs, claude, design),
# and the watcher/reader threads die alone. With abort, any of those would take
# the whole app, and every open shell, down with it.
